[package]
name = "magna-middleware"
version = "0.2.0"
edition = "2021"
description = "Modular, hardware-agnostic AOT inference middleware for embedded edge AI"
license = "MIT"

[dependencies]
# Logging & tracing (async-safe, Tokio-compatible)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"

# Image processing (for preprocessing)
image = "0.25"

# Concurrency
parking_lot = "0.12"
rayon = "1.10"
half = "2.4"

# Safe transmutation (replaces unsafe pointer casts)
bytemuck = { version = "1.14", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# gRPC and Async Network Layers
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# No optional camera dependencies needed in middleware

[dev-dependencies]
tempfile = "3.15"

[features]
default = ["cpu"]
cpu = []
nvidia = []
qualcomm = []
ti = []
cuda_runtime = ["nvidia"]
orin = ["nvidia"]  # NVIDIA Orin platform (FP16 max precision)
thor = ["nvidia"]  # NVIDIA Thor platform (FP8 support)
metrics = []       # Enable runtime performance metrics collection

[[bin]]
name = "magna"
path = "src/main.rs"

[[bin]]
name = "magna_server"
path = "src/bin/magna_server.rs"

[[bin]]
name = "create_middleware"
path = "src/bin/create_middleware.rs"

[build-dependencies]
cc = "1"
tonic-build = { version = "0.11", features = ["prost"] }
