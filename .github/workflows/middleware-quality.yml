name: Middleware Quality

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - cpu
          - nvidia
          - qualcomm
          - ti
          - cpu,metrics
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler nasm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - name: Lint backend feature
        run: cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings

  # Full build + test for cpu (no external SDK required)
  # Reuses artifacts already compiled by clippy-backends[cpu]
  build-test-cpu:
    runs-on: ubuntu-latest
    needs: clippy-backends
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler nasm
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu
      - name: Test (cpu)
        run: cargo test --features cpu
      - name: Test (cpu + metrics)
        run: cargo test --features cpu,metrics

  # Library-only build for hardware backends (external SDK symbols only needed at final link)
  build-lib-backends:
    runs-on: ubuntu-latest
    needs: clippy-backends
    strategy:
      fail-fast: false
      matrix:
        feature:
          - nvidia
          - qualcomm
          - ti
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler nasm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - name: Build library (${{ matrix.feature }})
        run: cargo build --lib --features ${{ matrix.feature }}

  # Single doc build covering all features; per-backend doc jobs were redundant
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler nasm
      - uses: Swatinem/rust-cache@v2
      - name: Check rustdoc warnings (all features)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
